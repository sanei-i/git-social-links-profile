<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/css/style.css">
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main class="page">
    <article class="card">
      <img  class="avatar" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
      <h1 class="name">Jessica Randall</h1>
      <p class="from">London, United Kingdom</p>
      <p class="career">"Front-end developer and avid reader."</p>
      <nav class="links">
        <a class="link-button" href="#">GitHub</a>
        <a class="link-button" href="#">Frontend Mentor</a>
        <a class="link-button" href="#">LinkedIn</a>
        <a class="link-button" href="#">Twitter</a>
        <a class="link-button" href="#">Instagram</a>
      </nav>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
